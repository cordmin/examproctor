# main 에 프로그램(src) 변경을 푸시하면 APP_VERSION 그대로 빌드하고 GitHub 릴리스에 올린다.
# 설치된 프로그램은 켤 때 최신 릴리스를 보고, 새 버전이면 업데이트할지 묻는다 (main.py check_update).
name: release

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

# 연달아 푸시해도 릴리스가 겹쳐 만들어지지 않게 하나씩 돌린다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # APP_VERSION 전체를 변경 성격에 맞게 지정한다. 빌드 횟수는 버전에 쓰지 않는다.
      # 오류 수정: patch / 호환되는 기능 추가: minor / 호환되지 않는 변경: major.
      - name: Set version
        shell: pwsh
        run: |
          $m = Select-String -Path src/main.py -Pattern "^APP_VERSION = '(\d+\.\d+\.\d+)'$"
          if (-not $m) { throw "main.py 에서 APP_VERSION 을 찾지 못했습니다." }
          $ver = $m.Matches[0].Groups[1].Value
          $existingTag = git ls-remote --tags origin "refs/tags/v$ver"
          if ($LASTEXITCODE -ne 0) { throw "기존 릴리스 버전을 확인하지 못했습니다." }
          if ($existingTag) { throw "v$ver 은 이미 배포됐습니다. 변경 성격에 맞게 APP_VERSION 을 올려 주세요." }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exe
        working-directory: src
        run: |
          pip install pywebview openpyxl pyinstaller
          pyinstaller 시험감독배정시스템.spec

      - name: Build installer
        working-directory: src
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          iscc "/DMyAppVersion=$env:VERSION" installer.iss

      - name: Test silent update notice through delayed restart
        working-directory: src
        shell: powershell
        run: ./test_update_installer.ps1

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: src/Output/ExamProctorSetup.exe
